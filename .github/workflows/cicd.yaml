name: CI：ビルド、テスト、ECRにPUSH

on:
  push:
    branches:
      - main

jobs:
  CI_1-build_and_test:
    name: CI_1-ビルドとテスト
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: cipassword
      MYSQL_ROOT_PASSWORD: cipassword

    steps:
      - name: GHAマシンに資材を配置
        uses: actions/checkout@v7

      - name: docker compose実行
        run: docker compose up -d --build

      - name: テスト1：php構文チェック
        run: |
          docker compose exec -T php php -l public/index.php
          docker compose exec -T php php -l src/status.php

      - name: テスト2：HTTP疎通チェック
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/ready

      - name: コンテナ破棄
        if: always()
        run: docker compose down -v

  CI_2-push_to_ecr:
    name: CI_2-ECRにプッシュ（テスト成功時のみ）
    runs-on: ubuntu-latest
    needs: CI_1-build_and_test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: GHAマシンに資材を配置
        uses: actions/checkout@v7

      - name: AWS認証情報取得
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECRにログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ビルド
        run: |
          docker build -f docker/web/Dockerfile -t web:local .
          docker build -f docker/php/Dockerfile -t ap:local .

      - name: イメージにタグ付け
        run: |
          docker tag web:local ${{steps.login-ecr.outputs.registry}}/eksargocd-ecr-repository-web:sha-${{github.sha}}
          docker tag ap:local ${{steps.login-ecr.outputs.registry}}/eksargocd-ecr-repository-ap:sha-${{github.sha}}

      - name: イメージをプッシュ
        run: |
          docker push ${{steps.login-ecr.outputs.registry}}/eksargocd-ecr-repository-web:sha-${{github.sha}}
          docker push ${{steps.login-ecr.outputs.registry}}/eksargocd-ecr-repository-ap:sha-${{github.sha}}



  CD_1-push_to_ecr:
    name: CD_1_プッシュしたイメージのタグを、webapマニフェストリポジトリのdeploymentのimageに転記（CI全体の成功時のみ）
    runs-on: ubuntu-latest
    needs: CI_2-push_to_ecr
    permissions:
      contents: read
      id-token: write

    steps:
      - name: GHappのトークンの取得
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{secrets.GHAPP_APP_ID}}
          private-key: ${{secrets.GHAPP_PRIVATE_KEY}}
          owner: ys-o
          repositories: EKS-ArgoCD-Handson_Application_manifests
          permission-contents: write

      - name: GHAマシンにwebapマニフェスト用リポジトリ資材を取得・配置
        uses: actions/checkout@v7
        with:
          repository: 'ys-o/EKS-ArgoCD-Handson_Application_manifests'
          ref: main
          token: ${{steps.token.outputs.token}}

      - name: 新しいコンテナイメージのタグを、webapのdeploymentマニフェストのimageのタグ部に転記
        env:
          ECR_ITTAN_ZIKAGAKI: '619071321369.dkr.ecr.ap-northeast-1.amazonaws.com/eksargocd-ecr-repository-'
        run: |
          sed -i "s|${ECR_ITTAN_ZIKAGAKI}web:.*|${ECR_ITTAN_ZIKAGAKI}web:sha-${{github.sha}}|" base/deployment.yaml
          sed -i "s|${ECR_ITTAN_ZIKAGAKI}ap:.*|${ECR_ITTAN_ZIKAGAKI}ap:sha-${{github.sha}}|" base/deployment.yaml

      - name: 更新した内容をmainブランチに直接PUSH
        run: |
          git config user.name "${{vars.GHAPP_APP_NAME}}"
          git config user.email "noreply@users.noreply.github.com"
          git add base/deployment.yaml
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "${{vars.GHAPP_APP_NAME}}による自動デプロイです。このCICDフローのSHAは、${{github.sha}}"
          git push origin HEAD:main