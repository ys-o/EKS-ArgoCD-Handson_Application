services:
  web:
    image: ${WEB_IMAGE:-handson-web:local}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      PHP_UPSTREAM: php:9000
    depends_on:
      php:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  php:
    image: ${AP_IMAGE:-handson-ap:local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-handson}
      DB_USER: ${DB_USER:-handson}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_TLS: disabled
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-handson}
      MYSQL_USER: ${DB_USER:-handson}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql-data:
